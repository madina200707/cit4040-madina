services:
  postgres:
    image: postgres:15
    container_name: electronics-store-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: shopdb
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5434:5432"
    volumes:
      - shop_db_data:/var/lib/postgresql/data

volumes:
  shop_db_data: