spring:
  application:
    name: electronics-store-backend

  config:
    import: optional:file:.env[.properties]

  profiles:
    active: dev

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5434/shopdb}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  flyway:
    enabled: true
    locations: classpath:db/migration

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 50

  mvc:
    problemdetails:
      enabled: false

  data:
    web:
      pageable:
        max-page-size: 100

server:
  port: 8080
  error:
    include-stacktrace: never
    include-message: never

jwt:
  secret: ${JWT_SECRET}
  access-token-expiration: 15m
  refresh-token-expiration: 7d

payment:
  min-delay-ms: 1000
  max-delay-ms: 3000
